name: Build Tidewater Chinese Android APK

on:
  workflow_dispatch:
  push:
    branches: ["build/tidewater-cn-android"]
    paths:
      - "tidewater-build/source.patch.xz.b64"
      - "tidewater-build/native-overlay.tar.xz.b64"
      - ".github/workflows/tidewater-cn-android.yml"

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager_bin=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Prepare Chinese mobile source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/zzzhengqi/tidewater.git tidewater-work
          git -C tidewater-work checkout d6afdd88c1883c8138e8c1bac8e8e2b18e066228
          base64 -d tidewater-build/source.patch.xz.b64 | xz -d | git -C tidewater-work apply -
          cd tidewater-work
          python3 - <<'PY'
          from pathlib import Path
          changes = {
           'src/App.js': [('exposure: 0.55,', 'exposure: 0.55,'), ('dynamicResolution: true,', 'dynamicResolution: false,')],
           'src/core/Engine.js': [('renderer.setPixelRatio( 1 );', "this.outputPixelRatio = /Android|iPhone|iPad|iPod/i.test( navigator.userAgent ) || navigator.maxTouchPoints > 1 ? Math.min( 1.5, window.devicePixelRatio || 1 ) : 1;\n\t\trenderer.setPixelRatio( this.outputPixelRatio );"), ('renderer.setPixelRatio( this.renderScale );', 'renderer.setPixelRatio( this.outputPixelRatio * this.renderScale );')],
           'src/post/PostFX.js': [('vignette: uniform( 0.28 )', 'vignette: uniform( 0.20 )')],
           'src/ui/AppUI.js': [('app.settings.exposure = 0.55 *', 'app.settings.exposure = 0.55 *')],
          }
          for filename, replacements in changes.items():
              p = Path(filename)
              text = p.read_text()
              for old, new in replacements:
                  assert text.count(old) == 1, (filename, old, text.count(old))
                  text = text.replace(old, new)
              p.write_text(text)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.js')
          s = p.read_text()
          marker = '\t\tinstallUnderwaterLighting( {'
          assert s.count(marker) == 1
          s = s.replace(marker, "\t\t// Fit detailed terrain and rocks within the actual device texture binding limit.\n\t\tthis.sampledTextureLimit = renderer.backend.device.limits.maxSampledTexturesPerShaderStage;\n\t\tif ( this.sampledTextureLimit < 21 ) {\n\t\t\tunderwaterMode( this.terrain.mesh, 'lite' );\n\t\t\tunderwaterMode( this.rocks.group, 'lite' );\n\t\t\tthis.terrain.material.groundBounce = false;\n\t\t}\n\n" + marker)
          p.write_text(s)
          
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ocean/UnderwaterLighting.js')
          s = p.read_text()
          s = s.replace('shoreSim = null } )', 'shoreSim = null, textureBudget = Infinity } )')
          old = "const mode = ( builder ) => ( builder.material && builder.material.underwaterLighting ) || 'full';"
          new = "const mode = ( builder ) => { const m = ( builder.material && builder.material.underwaterLighting ) || 'full'; return textureBudget < 21 && m === 'full' ? 'lite' : m; };"
          assert old in s
          p.write_text(s.replace(old, new))
          p = Path('src/App.js')
          s = p.read_text()
          old = 'shore: this.shore, surface: this.surface, shoreSim: this.shoreSim,'
          assert s.count(old) == 1
          s = s.replace(old, old + '\n\t\t\ttextureBudget: this.sampledTextureLimit,')
          s = s.replace('this.waterMaterial.clouds = this.clouds;', "this.waterMaterial.clouds = this.sampledTextureLimit < 24 ? null : this.clouds;\n\t\tif ( this.sampledTextureLimit < 24 ) { this.surface.detail = null; this.surface.foamShading = null; }")
          s = s.replace('this.ocean.receiveShadow = true;', 'this.ocean.receiveShadow = this.sampledTextureLimit >= 24;')
          p.write_text(s)
          
          PY
          npm ci
          npm run build
          npx cap add android
          base64 -d "$GITHUB_WORKSPACE/tidewater-build/native-overlay.tar.xz.b64" | tar -xJf - -C android
          sed -i 's/versionCode 1$/versionCode 3/; s/versionName "1.0"/versionName "1.2"/' android/app/build.gradle
          npx cap sync android
          node --test test/*.test.js

      - name: Reuse debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tidewater-debug-key-v1

      - name: Build installable APK
        shell: bash
        run: |
          set -euxo pipefail
          cd tidewater-work/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package APK and source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-output
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify --verbose tidewater-work/android/app/build/outputs/apk/debug/app-debug.apk
          /usr/local/lib/android/sdk/build-tools/36.0.0/aapt dump badging tidewater-work/android/app/build/outputs/apk/debug/app-debug.apk | head -5
          cp tidewater-work/android/app/build/outputs/apk/debug/app-debug.apk build-output/Tidewater-Android-CN-v1.2.apk
          cd tidewater-work
          zip -qr "$GITHUB_WORKSPACE/build-output/Tidewater-Android-CN-v1.2-Source.zip" .             -x ".git/*" "node_modules/*" "dist/*" "android/.gradle/*" "android/build/*"                "android/app/build/*" "android/app/src/main/assets/public/*"
          cd "$GITHUB_WORKSPACE"
          test -s build-output/Tidewater-Android-CN-v1.2.apk
          test -s build-output/Tidewater-Android-CN-v1.2-Source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tidewater-Android-CN-v1.2
          path: |
            build-output/Tidewater-Android-CN-v1.2.apk
            build-output/Tidewater-Android-CN-v1.2-Source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish build files on isolated branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f build-output/Tidewater-Android-CN-v1.2.apk build-output/Tidewater-Android-CN-v1.2-Source.zip
          git commit -m "ci: publish Tidewater Chinese Android build [skip ci]"
          git pull --rebase origin build/tidewater-cn-android
          git push
