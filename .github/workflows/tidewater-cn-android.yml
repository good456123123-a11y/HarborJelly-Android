      - name: Reuse debug signing key
        uses: actions/cache@v4
        with:
          path: build-signing/debug.keystore
          key: tidewater-explicit-debug-key-v2

      - name: Build installable APK
        shell: bash
        run: |
          set -euxo pipefail
          cd tidewater-work/android
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/build-signing"
          if [ ! -s "$GITHUB_WORKSPACE/build-signing/debug.keystore" ]; then
            keytool -genkeypair -keystore "$GITHUB_WORKSPACE/build-signing/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -storetype JKS
          fi
          ./gradlew assembleDebug --no-daemon -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/build-signing/debug.keystore" -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android

      - name: Package APK and source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build-output
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify --verbose tidewater-work/android/app/build/outputs/apk/debug/app-debug.apk
          /usr/local/lib/android/sdk/build-tools/36.0.0/aapt dump badging tidewater-work/android/app/build/outputs/apk/debug/app-debug.apk | head -5
          cp tidewater-work/android/app/build/outputs/apk/debug/app-debug.apk build-output/Tidewater-Android-CN-v1.3.apk
          cd tidewater-work
          zip -qr "$GITHUB_WORKSPACE/build-output/Tidewater-Android-CN-v1.3-Source.zip" .             -x ".git/*" "node_modules/*" "dist/*" "android/.gradle/*" "android/build/*"                "android/app/build/*" "android/app/src/main/assets/public/*"
          cd "$GITHUB_WORKSPACE"
          test -s build-output/Tidewater-Android-CN-v1.3.apk
          test -s build-output/Tidewater-Android-CN-v1.3-Source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tidewater-Android-CN-v1.3
          path: |
            build-output/Tidewater-Android-CN-v1.3.apk
            build-output/Tidewater-Android-CN-v1.3-Source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish build files on isolated branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f build-output/Tidewater-Android-CN-v1.3.apk build-output/Tidewater-Android-CN-v1.3-Source.zip
          git commit -m "ci: publish Tidewater Chinese Android build [skip ci]"
          git pull --rebase origin build/tidewater-cn-android
          git push

